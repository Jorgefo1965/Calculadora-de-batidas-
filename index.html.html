<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>GalopeApp v1.7.1 - Calculadora Cinemática</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white p-6">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-2xl font-bold mb-4 text-sky-400">GalopeApp v1.7.1 (Precisión FEI)</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 bg-slate-800 p-6 rounded-xl">
            <!-- Configuración -->
            <div class="space-y-4">
                <label class="block text-sm font-bold">Distancia Total (m): <span id="dist-val" class="text-sky-400">21.5</span></label>
                <input type="range" id="dist-input" min="10" max="30" step="0.1" value="21.5" class="w-full">
                
                <label class="block text-sm font-bold">Tranco Base (m): <span id="stride-val" class="text-sky-400">3.60</span></label>
                <input type="range" id="stride-input" min="3.2" max="4.0" step="0.05" value="3.60" class="w-full">
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-xs">Entrada:</label>
                        <select id="jump1-input" class="w-full bg-slate-900 p-2 rounded text-sm">
                            <option value="Vertical">Vertical</option>
                            <option value="Oxer" selected>Oxer</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs">Salida:</label>
                        <select id="jump2-input" class="w-full bg-slate-900 p-2 rounded text-sm">
                            <option value="Vertical" selected>Vertical</option>
                            <option value="Oxer">Oxer</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Resultados -->
            <div class="bg-slate-950 p-6 rounded-xl border border-slate-700">
                <h2 class="text-sm font-bold text-slate-400 mb-4 uppercase">Diagnóstico</h2>
                <div class="space-y-2">
                    <p>Trancos: <span id="res-strides" class="font-bold text-xl text-white">-</span></p>
                    <p>Ajuste por tranco: <span id="res-diff" class="font-bold text-lg text-sky-400">-</span></p>
                    <div id="res-advice" class="mt-4 p-3 bg-slate-800 rounded text-sm border-l-4 border-sky-500 italic"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SPECS = { "Vertical": { rec: 1.8, bat: 1.8 }, "Oxer": { rec: 2.0, bat: 2.0 } };

        function calc() {
            const d = parseFloat(document.getElementById('dist-input').value);
            const s = parseFloat(document.getElementById('stride-input').value);
            const j1 = SPECS[document.getElementById('jump1-input').value];
            const j2 = SPECS[document.getElementById('jump2-input').value];

            document.getElementById('dist-val').innerText = d;
            document.getElementById('stride-val').innerText = s.toFixed(2);

            const space = d - j1.rec - j2.bat;
            const strides = Math.round(space / s);
            const actualStride = space / strides;
            const diff = actualStride - s;

            document.getElementById('res-strides').innerText = strides;
            document.getElementById('res-diff').innerText = (diff > 0 ? '+' : '') + diff.toFixed(2) + ' m';
            
            let advice = diff > 0.1 ? "Línea abierta, exige galope expansivo." : 
                         diff < -0.1 ? "Línea apretada, exige recoger tranco." : "Distancia fluida y equilibrada.";
            document.getElementById('res-advice').innerText = advice;
        }

        document.querySelectorAll('input, select').forEach(el => el.addEventListener('input', calc));
        calc();
    </script>
</body>
</html>
